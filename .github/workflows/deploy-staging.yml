name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy. Leave empty to deploy the selected main commit SHA."
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v7

      - name: Resolve image version
        id: vars
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ -n "$REQUESTED_TAG" ]; then
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload staging deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: deploy/docker-compose.staging.yml,deploy/litellm-config.yaml,deploy/render_litellm_config.py
          target: /opt/aegora
          strip_components: 1

      - name: Pull and restart staging
        uses: appleboy/ssh-action@v1.2.5
        env:
          AEGORA_IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          GHCR_OWNER: ${{ steps.vars.outputs.owner }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITELLM_IMAGE: ${{ vars.LITELLM_IMAGE }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: AEGORA_IMAGE_TAG,GHCR_OWNER,GHCR_USERNAME,GHCR_TOKEN,LITELLM_IMAGE
          script: |
            set -eu
            cd /opt/aegora
            test -f .env

            # Supply-chain guard: staging only accepts an immutable LiteLLM
            # digest selected in the protected GitHub Environment.
            case "$LITELLM_IMAGE" in
              *@sha256:*) ;;
              *)
                echo "LITELLM_IMAGE must be an immutable image reference ending in @sha256:<64-hex-digest>" >&2
                exit 1
                ;;
            esac
            LITELLM_DIGEST="${LITELLM_IMAGE##*@sha256:}"
            if [ "${#LITELLM_DIGEST}" -ne 64 ] || ! printf '%s' "$LITELLM_DIGEST" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo "LITELLM_IMAGE contains an invalid sha256 digest" >&2
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export AEGORA_IMAGE_TAG GHCR_OWNER LITELLM_IMAGE

            # Render numeric budget/pricing fields before Compose starts LiteLLM.
            # The renderer runs inside the exact immutable LiteLLM image selected
            # for staging, so the host only needs Docker and never needs Python.
            docker pull "$LITELLM_IMAGE"
            docker run --rm \
              --entrypoint python \
              --env-file .env \
              -v "$PWD:/work" \
              "$LITELLM_IMAGE" \
              /work/render_litellm_config.py \
              /work/litellm-config.yaml \
              /work/litellm-config.runtime.yaml

            test -s litellm-config.runtime.yaml
            docker compose -f docker-compose.staging.yml config >/dev/null
            docker compose -f docker-compose.staging.yml pull
            docker image inspect "$LITELLM_IMAGE" >/dev/null
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker compose -f docker-compose.staging.yml ps

            i=0
            until curl -fsS http://127.0.0.1:4000/health/liveliness >/dev/null \
              && curl -fsS http://127.0.0.1:5000/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:8000/auth/config >/dev/null \
              && curl -fsS http://127.0.0.1:8080/ >/dev/null; do
              i=$((i + 1))
              if [ "$i" -ge 20 ]; then
                docker compose -f docker-compose.staging.yml logs --tail=100
                exit 1
              fi
              sleep 3
            done

            # Compatibility smoke test without a billable completion: query the
            # authenticated model registry from inside the LiteLLM container and
            # require Aegora's stable aliases to be present.
            docker compose -f docker-compose.staging.yml exec -T litellm python - <<'PY'
            import json
            import os
            import urllib.request

            request = urllib.request.Request(
                "http://127.0.0.1:4000/v1/models",
                headers={"Authorization": f"Bearer {os.environ['LITELLM_MASTER_KEY']}"},
            )
            with urllib.request.urlopen(request, timeout=5) as response:
                payload = json.load(response)

            available = {item.get("id") for item in payload.get("data", [])}
            required = {
                "aegora-chat",
                "aegora-fast",
                "aegora-chat-fallback",
                "aegora-fast-fallback",
            }
            missing = sorted(required - available)
            if missing:
                raise SystemExit(f"LiteLLM missing required Aegora aliases: {missing}")
            print("LiteLLM model aliases verified:", ", ".join(sorted(required)))

            if os.environ.get("LITELLM_MAX_BUDGET_USD", "").strip():
                info_request = urllib.request.Request(
                    "http://127.0.0.1:4000/v1/model/info",
                    headers={"Authorization": f"Bearer {os.environ['LITELLM_MASTER_KEY']}"},
                )
                with urllib.request.urlopen(info_request, timeout=5) as response:
                    model_info_payload = json.load(response)

                info_by_name = {
                    item.get("model_name"): item.get("model_info") or {}
                    for item in model_info_payload.get("data", [])
                    if item.get("model_name") in required
                }
                invalid_pricing = []
                for model_name in sorted(required):
                    info = info_by_name.get(model_name) or {}
                    input_cost = info.get("input_cost_per_token")
                    output_cost = info.get("output_cost_per_token")
                    if not isinstance(input_cost, (int, float)) or input_cost <= 0:
                        invalid_pricing.append(f"{model_name}.input_cost_per_token={input_cost!r}")
                    if not isinstance(output_cost, (int, float)) or output_cost <= 0:
                        invalid_pricing.append(f"{model_name}.output_cost_per_token={output_cost!r}")
                if invalid_pricing:
                    raise SystemExit(
                        "LiteLLM budget is enabled but effective pricing is missing/non-positive: "
                        + ", ".join(invalid_pricing)
                    )
                print("LiteLLM budget pricing verified for all primary/fallback model groups")
            PY

            echo "Aegora staging is healthy at image tag: $AEGORA_IMAGE_TAG"
            echo "LiteLLM image: $LITELLM_IMAGE"
