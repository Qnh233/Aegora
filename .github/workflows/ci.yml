name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/control-plane/backend/requirements.txt
            services/runtime/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/control-plane/backend/requirements.txt -r services/runtime/requirements.txt

      - name: Validate LiteLLM config renderer
        working-directory: deploy
        run: python test_render_litellm_config.py

      - name: Run control-plane tests
        working-directory: apps/control-plane/backend
        env:
          DATABASE_URL: postgresql://aegora:aegora@127.0.0.1:5432/aegora_test
          AUTH_MODE: local
        run: pytest -q

      - name: Run runtime tests
        working-directory: services/runtime
        env:
          PYTHONPATH: src
          LLM_GATEWAY_API_KEY: test-key
          # Unit tests must not depend on a live Runtime PostgreSQL audit sink.
          TOOL_LOG_DB_ENABLED: "false"
        run: pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-plane/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
