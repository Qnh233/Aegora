name: Build Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-main
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane-backend
            image: aegora-control-plane-backend
            context: apps/control-plane
            dockerfile: apps/control-plane/Dockerfile.backend
          - name: control-plane-frontend
            image: aegora-control-plane-frontend
            context: apps/control-plane
            dockerfile: apps/control-plane/Dockerfile.frontend
          - name: runtime
            image: aegora-runtime
            context: services/runtime
            dockerfile: services/runtime/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Normalize GHCR owner
        id: vars
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
